name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --timeout 120 -r requirements.txt -r requirements-dev.txt

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint check
        run: ruff check .

      - name: Train model for tests
        run: python -m app.ml.train --overwrite

      - name: Pytest with coverage
        run: pytest --cov=app

      - name: Docker build
        run: docker build -t banksys_sy_lixiaohua .
